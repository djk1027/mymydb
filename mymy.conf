# mymydb configuration file (mymy.conf)
#
# Format:  key = value
# Comments start with '#'. All settings below are shown with their built-in
# defaults; uncomment and edit a line to change it. These are global (instance-
# wide) parameters, mirrored into each database's parameters as its defaults.

# data_file: path to the durable data file.
#   - If set, mymydb persists to this file (block storage + checkpoint on every
#     mutation) and reloads it on startup.
#   - If unset (and no data-file argument is passed on the command line), the
#     database runs in memory only.
#   - A data-file argument on the command line (`./mymydb <path>`) overrides this.
# data_file = mymy.db

# block_size: size in bytes of a Block, the storage allocation unit.
#   - Applied only when a NEW data file is created. Existing files keep the
#     block size recorded in their superblock (no runtime re-layout).
#   - Range: 512 .. 65536. Default: 8192.
# block_size = 8192
