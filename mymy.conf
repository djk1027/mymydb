# mymydb configuration file (mymy.conf)
#
# Format:  key = value
# Comments start with '#'. All settings below are shown with their built-in
# defaults; uncomment and edit a line to change it. These are global (instance-
# wide) parameters, mirrored into each database's parameters as its defaults.

# base_path: root directory of the instance. Under it live:
#     bin/    binaries
#     data/   one file per database (<name>.mdb) plus the _master registry
#   Precedence: a command-line argument (`./mymydb <path>`) overrides this,
#   which overrides $MYMY/mymydb, which overrides $HOME/mymydb.
# base_path = /home/you/mymydb

# block_size: size in bytes of a Block, the storage allocation unit.
#   - Applied only when a NEW database file is created. Existing files keep the
#     block size recorded in their superblock (no runtime re-layout).
#   - Range: 512 .. 65536. Default: 8192.
# block_size = 8192
